name: LifeAtlas validation and Android APK
on:
  push:
    branches: [feature/skincare-v2]
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - '.github/workflows/skincare-validation.yml'
      - 'lib/core/database/skincare_schema.dart'
      - 'test/skincare*'
      - 'pubspec.*'
  workflow_dispatch:
concurrency:
  group: skincare-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIFEATLAS_RELEASE_KEYSTORE_BASE64: ${{ secrets.LIFEATLAS_RELEASE_KEYSTORE_BASE64 }}
      LIFEATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.LIFEATLAS_RELEASE_STORE_PASSWORD }}
      LIFEATLAS_RELEASE_KEY_ALIAS: ${{ secrets.LIFEATLAS_RELEASE_KEY_ALIAS }}
      LIFEATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.LIFEATLAS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare fixed release signing
        shell: bash
        run: |
          if [[ -n "$LIFEATLAS_RELEASE_KEYSTORE_BASE64" ]]; then
            test -n "$LIFEATLAS_RELEASE_STORE_PASSWORD"
            test -n "$LIFEATLAS_RELEASE_KEY_ALIAS"
            test -n "$LIFEATLAS_RELEASE_KEY_PASSWORD"
            echo "$LIFEATLAS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifeatlas-release.jks"
            echo "LIFEATLAS_RELEASE_STORE_FILE=$RUNNER_TEMP/lifeatlas-release.jks" >> "$GITHUB_ENV"
          else
            echo "LIFEATLAS_ALLOW_DEBUG_RELEASE=true" >> "$GITHUB_ENV"
            echo "::warning::Fixed release signing is not configured. APK is validation-only and will not be published."
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test tooling/cloudflare_worker/*.test.mjs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAtlas-2.1.0-android-validation
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish signed release
        if: github.event_name == 'push' && env.LIFEATLAS_RELEASE_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk LifeAtlas-2.1.0.apk
          sha256sum LifeAtlas-2.1.0.apk > LifeAtlas-2.1.0.apk.sha256
          if gh release view v2.1.0 >/dev/null 2>&1; then
            echo "Version v2.1.0 is already published; keep it immutable."
            exit 0
          fi
          gh release create v2.1.0 LifeAtlas-2.1.0.apk LifeAtlas-2.1.0.apk.sha256 --target "$GITHUB_SHA" --title "LifeAtlas v2.1.0" --notes-file UPDATE_RELEASE_NOTES.md
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lifeatlas-release.jks"
