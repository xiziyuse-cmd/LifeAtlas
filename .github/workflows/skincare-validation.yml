name: LifeAtlas validation and Android APK
on:
  push:
    branches: [feature/skincare-v2]
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - '.github/workflows/skincare-validation.yml'
      - 'lib/core/database/skincare_schema.dart'
      - 'test/skincare*'
      - 'pubspec.*'
  workflow_dispatch:
concurrency:
  group: skincare-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIFEATLAS_RELEASE_KEYSTORE_BASE64: ${{ secrets.LIFEATLAS_RELEASE_KEYSTORE_BASE64 }}
      LIFEATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.LIFEATLAS_RELEASE_STORE_PASSWORD }}
      LIFEATLAS_RELEASE_KEY_ALIAS: ${{ secrets.LIFEATLAS_RELEASE_KEY_ALIAS }}
      LIFEATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.LIFEATLAS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read release version
        shell: bash
        run: |
          python - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', Path('pubspec.yaml').read_text(), re.M)
          if not version:
              raise SystemExit('Invalid app version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'LIFEATLAS_VERSION={version[1]}\nLIFEATLAS_BUILD={version[2]}\n')
          PYVERSION
      - name: Prepare fixed release signing
        shell: bash
        run: |
          if [[ -n "$LIFEATLAS_RELEASE_KEYSTORE_BASE64" ]]; then
            test -n "$LIFEATLAS_RELEASE_STORE_PASSWORD"
            test -n "$LIFEATLAS_RELEASE_KEY_ALIAS"
            test -n "$LIFEATLAS_RELEASE_KEY_PASSWORD"
            echo "$LIFEATLAS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lifeatlas-release.jks"
            echo "LIFEATLAS_RELEASE_STORE_FILE=$RUNNER_TEMP/lifeatlas-release.jks" >> "$GITHUB_ENV"
          else
            echo "LIFEATLAS_ALLOW_DEBUG_RELEASE=true" >> "$GITHUB_ENV"
            echo "::warning::Fixed release signing is not configured. APK is validation-only and will not be published."
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test tooling/cloudflare_worker/*.test.mjs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAtlas-${{ env.LIFEATLAS_VERSION }}-android-validation
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish signed release
        if: github.event_name == 'push' && env.LIFEATLAS_RELEASE_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "LifeAtlas-$LIFEATLAS_VERSION.apk"
          sha256sum "LifeAtlas-$LIFEATLAS_VERSION.apk" > "LifeAtlas-$LIFEATLAS_VERSION.apk.sha256"
          if gh release view "v$LIFEATLAS_VERSION" >/dev/null 2>&1; then
            echo "Version $LIFEATLAS_VERSION is already published; keep it immutable."
            exit 0
          fi
          gh release create "v$LIFEATLAS_VERSION" "LifeAtlas-$LIFEATLAS_VERSION.apk" "LifeAtlas-$LIFEATLAS_VERSION.apk.sha256" --target "$GITHUB_SHA" --title "LifeAtlas v$LIFEATLAS_VERSION" --notes-file UPDATE_RELEASE_NOTES.md
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lifeatlas-release.jks"
