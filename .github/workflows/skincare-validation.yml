name: LifeAtlas validation and Android APK
on:
  push:
    branches: [feature/skincare-v2, main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.*'
      - 'tooling/**'
      - '.github/workflows/skincare-validation.yml'
      - 'UPDATE_RELEASE_NOTES.md'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - '.github/workflows/skincare-validation.yml'
      - 'lib/core/database/skincare_schema.dart'
      - 'test/skincare*'
      - 'pubspec.*'
  workflow_dispatch:
concurrency:
  group: skincare-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  # Fixed signing custody authorized and initialized on 2026-10-29.
  LIFEATLAS_AUTO_RELEASE: 'true'
permissions:
  contents: write
  id-token: write
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Read release version
        shell: bash
        run: |
          python - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', Path('pubspec.yaml').read_text(), re.M)
          if not version:
              raise SystemExit('Invalid app version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'LIFEATLAS_VERSION={version[1]}\nLIFEATLAS_BUILD={version[2]}\n')
          PYVERSION
      - name: Load fixed signing through GitHub identity
        if: github.event_name != 'pull_request' && env.LIFEATLAS_AUTO_RELEASE == 'true'
        run: python tooling/auto_release.py prepare-signing
      - name: Configure validation-only signing
        if: github.event_name == 'pull_request' || env.LIFEATLAS_AUTO_RELEASE != 'true'
        run: echo "LIFEATLAS_ALLOW_DEBUG_RELEASE=true" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tooling -p 'test_auto_release.py'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test tooling/cloudflare_worker/*.test.mjs
      - run: flutter build apk --release
      - name: Automatically publish and synchronize the App update
        if: github.event_name != 'pull_request' && env.LIFEATLAS_AUTO_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tooling/auto_release.py publish
      - uses: actions/upload-artifact@v4
        with:
          name: LifeAtlas-${{ env.LIFEATLAS_VERSION }}-android-${{ env.LIFEATLAS_AUTO_RELEASE == 'true' && 'release' || 'validation' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            update-metadata.json
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lifeatlas-release.p12"
